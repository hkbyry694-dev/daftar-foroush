<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2b8c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="دفتر فروش"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>دفتر فروش</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap">
<style>
/* ساختار: همه‌چیز باکس گرد؛ با لمس یا انتخاب، زمینه آبی و نوشته/آیکون سفید می‌شود */
:root{
  --bg:#eef1f8;--card:#ffffff;--fg:#13183a;--muted:#6a7392;--line:#e0e5f1;
  --accent:#1b2b8c;--head:#1b2b8c;--on-accent:#ffffff;--soft:#e7ebfa;
  --red:#b3122b;--red-soft:#fde7ea;--green:#13803c;--green-soft:#e1f6e8;--amber:#a15c00;--amber-soft:#fff1d6;
  --sale:#8d0f1f;--buy:#0f6b34;--r:18px;--r-sm:14px;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --font:'Vazirmatn',system-ui,-apple-system,Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0f20;--card:#171b35;--fg:#e8ebff;--muted:#99a2c8;--line:#262b4d;
  --accent:#5a72ff;--head:#1c2570;--on-accent:#ffffff;--soft:#222850;
  --red:#ff7b8f;--red-soft:#3a1a24;--green:#58d98a;--green-soft:#15301f;--amber:#ffc266;--amber-soft:#3a2d12;
  --sale:#6e1220;--buy:#0d4f29;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f20;--card:#171b35;--fg:#e8ebff;--muted:#99a2c8;--line:#262b4d;
  --accent:#5a72ff;--head:#1c2570;--on-accent:#ffffff;--soft:#222850;
  --red:#ff7b8f;--red-soft:#3a1a24;--green:#58d98a;--green-soft:#15301f;--amber:#ffc266;--amber-soft:#3a2d12;
  --sale:#6e1220;--buy:#0d4f29;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:0;padding-right:0;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
.ico{flex:none;display:block}
.num,.tabnum{font-variant-numeric:tabular-nums}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:160px;-webkit-overflow-scrolling:touch}

/* لمس و انتخاب */
.tap{transition:background-color .14s,color .14s,border-color .14s,transform .08s;cursor:pointer;user-select:none;-webkit-user-select:none}
.tap:active,.tap.on{background:var(--accent)!important;color:var(--on-accent)!important;border-color:var(--accent)!important}
.tap:active *,.tap.on *{color:inherit!important;border-color:currentColor}
.tap:active{transform:scale(.985)}
.tap:active .chipx,.tap.on .chipx{background:rgba(255,255,255,.2)!important}

/* سرتیتر */
.top{background:var(--head);color:#fff;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:14px;padding-bottom:14px;border-radius:0 0 26px 26px}
.top h1{margin:0;font-size:19px;font-weight:700}
.top .sub{opacity:.8;font-size:13px}
.ledger-pick{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);color:#fff;border-radius:var(--r);padding:10px 14px;width:100%;text-align:right}
.ledger-pick .t{flex:1;min-width:0}
.ledger-pick b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger-pick small{opacity:.8;font-size:12px}
.ledger-pick.tap:active,.ledger-pick.tap.on{background:#fff!important;color:var(--accent)!important}
.seg{display:flex;gap:8px;margin-top:12px}
.seg button{flex:1;padding:10px;border-radius:var(--r-sm);background:rgba(255,255,255,.14);color:#fff;font-weight:500}
.seg button.on{background:#fff!important;color:var(--accent)!important}
.seg button:active{background:#fff!important;color:var(--accent)!important}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.top .chips .chip{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:13px}
.top .chips .chip.on{background:#fff!important;color:var(--accent)!important}
.top .chips .chip:active{background:#fff!important;color:var(--accent)!important}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchips .chip{padding:7px 14px;border-radius:999px;background:var(--bg);color:var(--fg);border:1px solid var(--line);font-size:13.5px}
.pbody .fchips .chip{background:var(--card)}
.pbody .box .fchips .chip,.sheet .fchips .chip{background:var(--bg)}

.status{background:var(--card);color:var(--fg);border-radius:var(--r);padding:14px 16px;margin-top:12px}
.status .lbl{font-size:12px;color:var(--muted)}
.status .val{font-size:20px;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.status .val small{font-size:13px;font-weight:500}
.neg{color:var(--red)}.pos{color:var(--green)}.mut{color:var(--muted)}

.wrap{padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:10px 16px;color:var(--muted);border:1px solid var(--line)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--fg)}
.count{color:var(--muted);font-size:13px;margin:12px 4px 6px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 14px;width:100%;text-align:right;color:var(--fg)}
.row .av{width:44px;height:44px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.row .end{text-align:left;flex:none;max-width:48%}
.row .end b{display:block;font-weight:700;font-size:14px}
.row .end small{display:block;font-size:12px}
.row.tap:active .av,.row.tap.on .av{background:rgba(255,255,255,.2)!important}
.av.red{background:var(--red-soft);color:var(--red)}.av.green{background:var(--green-soft);color:var(--green)}.av.amber{background:var(--amber-soft);color:var(--amber)}
.day{color:var(--muted);font-size:12.5px;margin:14px 4px 6px}
.empty{text-align:center;color:var(--muted);padding:34px 20px;background:var(--card);border-radius:var(--r);margin-top:12px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

/* دکمه شناور و ناوبری */
.fabs{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center;z-index:20}
.fab{width:58px;height:58px;border-radius:20px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(20,30,110,.35)}
.fab.tap:active{background:var(--fg)!important;color:var(--bg)!important}
.fab-x{height:50px;padding:0 22px;border-radius:18px;background:var(--accent);color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(20,30,110,.3)}
.fab-x.tap:active{background:var(--fg)!important;color:var(--bg)!important}
nav.bar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;gap:4px;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:30;border-radius:22px 22px 0 0}
nav.bar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;font-size:11.5px;color:var(--muted)}
nav.bar button.on{color:#fff}

/* باکس‌ها */
.box{background:var(--card);border-radius:var(--r);padding:12px 14px;border:1px solid transparent}
.boxes{display:grid;gap:8px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.cell{background:var(--card);border-radius:var(--r-sm);padding:10px 12px;text-align:right;min-width:0}
.cell small{display:block;color:var(--muted);font-size:12px}
.cell b{font-weight:600;font-size:14.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:var(--r-sm);background:var(--accent);color:#fff;font-weight:600;width:100%}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.danger.tap:active{background:var(--red)!important;color:#fff!important}
.btn.ghost.tap:active,.btn.ghost.tap.on{background:var(--accent)!important}
.btn.tap:active{background:var(--fg)!important;color:var(--bg)!important}
.btn.ghost.tap:active{background:var(--accent)!important;color:#fff!important}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--accent)}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.green{background:var(--green-soft);color:var(--green)}.pill.amber{background:var(--amber-soft);color:var(--amber)}

/* فرم‌ها */
.f{position:relative;margin-top:14px}
.f label{position:absolute;top:-9px;right:14px;background:var(--bg);padding:0 6px;font-size:12px;color:var(--accent);z-index:1}
.sheet .f label{background:var(--card)}
.f input,.f select,.f textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;outline:0;appearance:none;-webkit-appearance:none;min-height:50px}
.sheet .f input,.sheet .f select,.sheet .f textarea{background:var(--bg)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f textarea{min-height:90px;resize:vertical}
.f.sel::after{content:"";position:absolute;left:16px;top:50%;width:8px;height:8px;border-left:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(-45deg);pointer-events:none}
.f .pick{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;min-height:50px;text-align:right}
.sheet .f .pick{background:var(--bg)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 4px 0}
.hint.bad{color:var(--red)}
.lines{display:flex;flex-direction:column;gap:2px}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;align-items:baseline}
.line.big{font-weight:700;font-size:16px}
.line small{color:var(--muted)}
.chk{display:flex;align-items:center;gap:10px;padding:8px 2px;width:100%;text-align:right}
.chk .b{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk.on .b{background:var(--accent);border-color:var(--accent);color:#fff}
.sec{margin-top:14px}
.sec h3{margin:0 4px 8px;font-size:14px;color:var(--muted);font-weight:600}

/* صفحه و برگه */
#pages,#sheets{position:fixed;inset:0;pointer-events:none;z-index:50}
.page{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;pointer-events:auto;max-width:560px;margin:0 auto;animation:slide .2s ease-out}
@keyframes slide{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.phead{background:var(--head);color:#fff;display:flex;align-items:center;gap:10px;padding:max(14px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 14px max(14px,env(safe-area-inset-left,0px));border-radius:0 0 22px 22px;flex:none}
.page.sale .phead{background:var(--sale)}.page.buy .phead{background:var(--buy)}
.phead h2{margin:0;flex:1;font-size:17px;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:40px;height:40px;border-radius:13px;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;flex:none}
.hbtn.tap:active{background:#fff!important;color:var(--accent)!important}
.hr{display:flex;gap:8px}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px))}
.pfoot{flex:none;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px}
.sw{position:fixed;inset:0;pointer-events:auto;display:flex;flex-direction:column;justify-content:flex-end;max-width:560px;margin:0 auto}
.sbk{position:absolute;inset:0;background:rgba(8,10,30,.5);animation:fade .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;background:var(--card);border-radius:26px 26px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88%;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h3.st{margin:4px 2px 4px;font-size:17px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.acts button{padding:18px 10px;border-radius:var(--r);font-weight:600;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:6px}
.acts .g{background:var(--green-soft);color:var(--green)}.acts .r{background:var(--red-soft);color:var(--red)}
.acts .b{background:var(--soft);color:var(--accent)}
.acts button.tap:active{background:var(--accent)!important;color:#fff!important}
.pr{display:flex;gap:10px;margin-top:10px}
.pr .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:99;max-width:88%;text-align:center;font-size:14px;animation:fade .15s}
.toast.err{background:var(--red);color:#fff}

/* تقویم */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px}
.cal .w{font-size:12px;color:var(--accent);padding:6px 0}
.cal button{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;background:var(--bg)}
.cal span{aspect-ratio:1}
.calh{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.calh b{font-size:16px}
.calh button{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center}

.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.items .it{background:var(--card);border-radius:var(--r);padding:12px 14px;width:100%;text-align:right;display:block}
.it .a{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.it .b2{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{color:var(--muted);font-weight:500;text-align:right;padding:6px 4px}
.tbl td{padding:8px 4px;border-top:1px solid var(--line)}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:left}
textarea.big{width:100%;min-height:150px;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:12px;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.ok-note{background:var(--green-soft);color:var(--green);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin-top:10px}
.warn-note{background:var(--amber-soft);color:var(--amber);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;margin-top:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* آمار و نمودار */
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:2px 2px 8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px;vertical-align:-1px}
.ch{width:100%;height:auto;display:block;direction:ltr}
.ch text{font-family:var(--font);font-size:9.5px;fill:var(--muted)}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .hit{fill:transparent;cursor:pointer}
.ch .sel{fill:var(--soft)}
.rk{display:flex;flex-direction:column;gap:10px}
.rk .r1{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.rk .r1 b{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .r1 span{font-size:13px;color:var(--fg)}
.rk .tr{grid-column:1/-1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.rk .tr i{display:block;height:100%;border-radius:4px}
.rk small{grid-column:1/-1;color:var(--muted);font-size:12px}
.wk{display:flex;gap:6px;align-items:flex-end;height:130px;padding-top:18px}
.wk .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;min-width:0}
.wk .c i{display:block;width:100%;max-width:34px;border-radius:5px 5px 0 0;background:var(--s1);min-height:2px}
.wk .c em{font-style:normal;font-size:11.5px;color:var(--muted)}
.wk .c b{font-size:10.5px;font-weight:600;white-space:nowrap}
.mix{display:flex;gap:2px;height:16px;border-radius:8px;overflow:hidden}
.mix i{display:block;height:100%}
.mixl{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:10px;font-size:13px}
.mixl i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:6px}
.ins{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.ins li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7}
.ins li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:9px}
.ins li.w:before{background:var(--amber)}
details.tb summary{cursor:pointer;color:var(--accent);font-size:13px;padding:6px 0}
.tip{background:var(--soft);border-radius:var(--r-sm);padding:8px 12px;font-size:13px;margin-top:8px;min-height:38px}
.f:has(.fchips)>label{position:static;display:block;background:none;padding:0 2px 2px;font-size:12.5px}
.f:has(.fchips){margin-top:16px}

</style>
<div id="app"><main id="main"></main><nav class="bar" id="nav" aria-label="بخش‌های اصلی"></nav></div><div id="pages"></div><div id="sheets"></div>
<script>
/* منطق حسابداری: بدون وابستگی به صفحه، قابل تست مستقل */
(function (root) {
'use strict';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const R = Math.round;

/* ---------- تاریخ شمسی ---------- */
function g2j(gy, gm, gd) {
  const gdm = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy = gy > 1600 ? 979 : 0; gy -= gy > 1600 ? 1600 : 621;
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 365 * gy + ~~((gy2 + 3) / 4) - ~~((gy2 + 99) / 100) + ~~((gy2 + 399) / 400) - 80 + gd + gdm[gm - 1];
  jy += 33 * ~~(days / 12053); days %= 12053;
  jy += 4 * ~~(days / 1461); days %= 1461;
  if (days > 365) { jy += ~~((days - 1) / 365); days = (days - 1) % 365; }
  const jm = days < 186 ? 1 + ~~(days / 31) : 7 + ~~((days - 186) / 30);

function jMonthLen(jy, jm) { return jm <= 6 ? 31 : jm <= 11 ? 30 : (jLeap(jy) ? 30 : 29); }
const JM = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
const JW = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه', 'شنبه'];

/* ---------- وضعیت اولیه (خام) ---------- */
function newState() {

/* ---------- محاسبه موجودی و قیمت تمام‌شده ---------- */
function stockOf(S, pid) { return S.batches.reduce((s, b) => b.pid === pid ? s + b.left : s, 0); }
function stockValue(S, pid) { return S.batches.reduce((s, b) => b.pid === pid ? s + b.left * b.price : s, 0); }
function lastBuyPrice(S, pid) { const bs = S.batches.filter(b => b.pid === pid).sort((a, b) => a.ts - b.ts || a.seq - b.seq); return bs.length ? bs[bs.length - 1].price : 0; }

function planCost(batches, pid, qty, mode) {
  const all = batches.filter(b => b.pid === pid).sort((a, b) => a.ts - b.ts || a.seq - b.seq);
  const live = all.filter(b => b.left > 1e-9);
  const avail = live.reduce((s, b) => s + b.left, 0);
  if (qty > avail + 1e-9) return { error: true, avail };
  let unit = 0;
  if (mode === 'last') unit = all.length ? all[all.length - 1].price : 0;
  else if (mode === 'avg') { const v = live.reduce((s, b) => s + b.left * b.price, 0); unit = avail ? v / avail : 0; }
  let need = qty, fifo = 0; const consumed = [];
  for (const b of live) {
    if (need <= 1e-9) break;
    const t = Math.min(b.left, need);
    consumed.push({ bid: b.id, qty: t }); fifo += t * b.price; need -= t;
  }
  const cost = mode === 'fifo' ? R(fifo) : R(unit * qty);
  return { cost, consumed };
}

function partnerApplies(S, pid, productId) {
  const p = S.partners.find(x => x.id === pid);
  return p && (!p.pids || !p.pids.length || p.pids.includes(productId));
}

/* پیش‌نمایش فروش بدون تغییر در داده‌ها */
function previewSale(S, d) {
  const mode = S.settings.costMode;
  const items = (d.items || []).filter(i => i.pid);
  if (!items.length) return { error: 'حداقل یک محصول اضافه کنید.' };
  const tmp = S.batches.map(b => ({ id: b.id, pid: b.pid, ts: b.ts, seq: b.seq, left: b.left, price: b.price }));
  const out = [];
  for (const it of items) {
    const qty = +it.qty, price = +it.price;
    const prod = S.products.find(p => p.id === it.pid);
    if (!(qty > 0)) return { error: 'تعداد باید بیشتر از صفر باشد.' };
    if (!(price >= 0)) return { error: 'قیمت فروش معتبر نیست.' };
    const plan = planCost(tmp, it.pid, qty, mode);
    if (plan.error) return { error: `موجودی «${prod ? prod.name : ''}» کافی نیست (موجود: ${plan.avail}).` };
    for (const c of plan.consumed) tmp.find(b => b.id === c.bid).left -= c.qty;
    const total = R(qty * price);
    out.push({ pid: it.pid, qty, price, total, cost: plan.cost, profit: total - plan.cost, consumed: plan.consumed });
  }
  const sub = out.reduce((s, i) => s + i.total, 0);
  const tax = d.taxOn ? R(sub * (S.settings.taxRate || 0) / 100) : 0;
  const extra = R(+d.extra || 0);
  const total = sub + tax + extra;
  const profit = out.reduce((s, i) => s + i.profit, 0);
  const shares = [], warnings = [];
  let pctSum = 0;
  for (const dp of d.partners || []) {
    const part = S.partners.find(x => x.id === dp.partnerId); if (!part) continue;
    let amount = 0;
    const app = out.filter(i => partnerApplies(S, dp.partnerId, i.pid));
    if (dp.mode === 'percent') { amount = R(app.reduce((s, i) => s + i.profit, 0) * (+dp.value || 0) / 100); pctSum += +dp.value || 0; }
    else amount = R(app.reduce((s, i) => s + i.qty, 0) * (+dp.value || 0));
    shares.push({ partnerId: dp.partnerId, mode: dp.mode, value: +dp.value || 0, amount });
  }
  /* سهم شریک از شرایط ثبت‌شده در خرید هر محصول (دسته‌ی خرید) */
  const auto = {};
  for (const it of out) for (const c of it.consumed) {
    const b = S.batches.find(x => x.id === c.bid); if (!b || !b.partners) continue;
    const chunk = it.qty ? it.profit * c.qty / it.qty : 0;
    for (const bp of b.partners) {
      if (!(+bp.value > 0)) continue;
      const a = auto[bp.partnerId] || (auto[bp.partnerId] = { amount: 0, pBase: 0, pQty: 0, modes: new Set() });
      if (bp.mode === 'percent') { a.amount += chunk * bp.value / 100; a.pBase += chunk; } else { a.amount += c.qty * bp.value; a.pQty += c.qty; }
      a.modes.add(bp.mode);
    }
  }
  const manualIds = new Set((d.partners || []).map(x => x.partnerId));
  const autoShares = [];
  for (const k of Object.keys(auto)) {
    if (manualIds.has(k) || !S.partners.find(x => x.id === k)) continue;
    const a = auto[k], mode = a.modes.size > 1 ? 'mixed' : [...a.modes][0];
    let value = null;
    if (mode === 'percent') { value = a.pBase ? R(a.amount / a.pBase * 10000) / 100 : 0; pctSum += value; } else if (mode === 'unit') value = a.pQty ? R(a.amount / a.pQty) : 0;
    autoShares.push({ partnerId: k, mode, value, amount: R(a.amount), auto: true });
  }
  shares.unshift(...autoShares);
  if (pctSum > 100) warnings.push('جمع درصد شرکا از ۱۰۰ بیشتر است.');
  let visitorComm = 0;
  const vis = S.visitors.find(v => v.id === d.visitorId);
  if (vis) {
    if (vis.mode === 'profit') visitorComm = R(profit * vis.value / 100);
    else if (vis.mode === 'sales') visitorComm = R(sub * vis.value / 100);
  }
  const ownerShare = profit - shares.reduce((s, x) => s + x.amount, 0) - visitorComm;
  if (ownerShare < 0) warnings.push('سهم شما از این فروش منفی می‌شود.');
  return { items: out, sub, tax, extra, total, profit, shares, visitorComm, ownerShare, warnings };
}

/* ---------- ابزار تراکنشی: در صورت خطا همه‌چیز برمی‌گردد ---------- */
function tx(S, fn) {
  const snap = clone(S);
  try { const r = fn(S); return { ok: true, value: r }; }
  catch (e) { Object.keys(S).forEach(k => delete S[k]); Object.assign(S, snap); return { error: e.message || String(e) }; }
}
const nextSeq = S => ++S.seq;

function removeRefs(S, id) {
  S.txns = S.txns.filter(t => t.ref !== id);
  S.pent = S.pent.filter(t => t.ref !== id);
  S.partE = S.partE.filter(t => t.ref !== id);
  S.visE = S.visE.filter(t => t.ref !== id);
}
function deleteDocRaw(S, id) {
  const doc = S.docs.find(x => x.id === id); if (!doc) throw new Error('سند پیدا نشد.');
  if (doc.type === 'sale') {
    for (const it of doc.items) for (const c of it.consumed) { const b = S.batches.find(x => x.id === c.bid); if (b) b.left += c.qty; }
  } else if (doc.type === 'buy') {
    const bs = S.batches.filter(b => b.ref === id);
    if (bs.some(b => b.left < b.qty - 1e-9)) throw new Error('بخشی از کالای این خرید فروخته شده و حذف آن ممکن نیست.');
    S.batches = S.batches.filter(b => b.ref !== id);
  }
  removeRefs(S, id);
  S.docs = S.docs.filter(x => x.id !== id);
  return doc;
}
function deleteDoc(S, id) { return tx(S, s => deleteDocRaw(s, id)); }

function needAccount(S, d) { if (!S.accounts.find(a => a.id === d.accountId)) throw new Error('حساب را انتخاب کنید.'); }

function addSale(S, d, editId) {
  return tx(S, s => {
    let no = null, ts = d.ts;
    if (editId) { const old = deleteDocRaw(s, editId); no = old.no; }
    const pv = previewSale(s, d); if (pv.error) throw new Error(pv.error);
    if (!s.parties.find(p => p.id === d.partyId)) throw new Error('طرف‌حساب را انتخاب کنید.');
    if (d.payType !== 'credit') needAccount(s, d);
    if (no == null) no = s.settings.nextSale++;
    const id = uid(), seq = nextSeq(s);
    for (const it of pv.items) for (const c of it.consumed) s.batches.find(b => b.id === c.bid).left -= c.qty;
    const doc = { id, seq, type: 'sale', no, ts, ledgerId: d.ledgerId, partyId: d.partyId, items: pv.items, sub: pv.sub, tax: pv.tax, extra: pv.extra, total: pv.total,
      payType: d.payType, accountId: d.payType !== 'credit' ? d.accountId : null, visitorId: d.visitorId || null, shares: pv.shares, visitorComm: pv.visitorComm,
      profit: pv.profit, ownerShare: pv.ownerShare, note: d.note || '' };
    s.docs.push(doc);
    if (d.payType !== 'credit') s.txns.push({ id: uid(), ref: id, ts, accountId: d.accountId, amount: pv.total });
    else s.pent.push({ id: uid(), ref: id, ts, partyId: d.partyId, delta: pv.total });
    for (const sh of pv.shares) s.partE.push({ id: uid(), ref: id, ts, partnerId: sh.partnerId, amount: sh.amount, kind: 'share' });
    if (d.visitorId && pv.visitorComm) s.visE.push({ id: uid(), ref: id, ts, visitorId: d.visitorId, amount: pv.visitorComm, kind: 'commission' });
    return doc;
  });
}

function calcBuy(S, d) {
  const items = (d.items || []).filter(i => i.pid);
  if (!items.length) throw new Error('حداقل یک محصول اضافه کنید.');
  const out = items.map(i => {
    const qty = +i.qty, price = +i.price;
    if (!(qty > 0)) throw new Error('تعداد باید بیشتر از صفر باشد.');
    if (!(price >= 0)) throw new Error('قیمت خرید معتبر نیست.');
    return { pid: i.pid, qty, price, total: R(qty * price), partners: (i.partners || []).filter(p => +p.value > 0).map(p => ({ partnerId: p.partnerId, mode: p.mode, value: +p.value })) };
  });
  const sub = out.reduce((s, i) => s + i.total, 0);
  const tax = d.taxOn ? R(sub * (S.settings.taxRate || 0) / 100) : 0;
  const freight = R(+d.freight || 0);
  if (freight < 0) throw new Error('کرایه معتبر نیست.');
  const by = d.freightBy === 'amount' && sub > 0 ? 'amount' : 'qty';
  const totQty = out.reduce((s, i) => s + i.qty, 0);
  out.forEach(r => { const share = by === 'amount' ? freight * r.total / sub : freight * r.qty / totQty; r.fpu = r.qty ? share / r.qty : 0; r.unitCost = r.price + r.fpu; });
  return { out, sub, tax, freight, by, freightInv: (d.freightMode || 'inv') === 'inv' };
}
function addBuy(S, d, editId) {
  return tx(S, s => {
    let no = null;
    if (editId) { const old = deleteDocRaw(s, editId); no = old.no; }
    const c = calcBuy(s, d);
    if (!s.parties.find(p => p.id === d.partyId)) throw new Error('طرف‌حساب را انتخاب کنید.');
    if (d.payType !== 'credit') needAccount(s, d);
    if (c.freight > 0 && !c.freightInv && !s.accounts.find(a => a.id === d.freightAcct)) throw new Error('حساب پرداخت کرایه را انتخاب کنید.');
    if (no == null) no = s.settings.nextBuy++;
    const id = uid(), seq = nextSeq(s);
    const total = c.sub + c.tax + (c.freightInv ? c.freight : 0);
    for (const it of c.out) s.batches.push({ id: uid(), ref: id, pid: it.pid, ts: d.ts, seq: nextSeq(s), qty: it.qty, left: it.qty, price: it.unitCost, base: it.price, fpu: it.fpu, partners: it.partners });
    const doc = { id, seq, type: 'buy', no, ts: d.ts, ledgerId: d.ledgerId, partyId: d.partyId, items: c.out, sub: c.sub, tax: c.tax, freight: c.freight, freightMode: c.freightInv ? 'inv' : 'acct', freightBy: c.by, freightAcct: c.freightInv ? null : d.freightAcct, total,
      payType: d.payType, accountId: d.payType !== 'credit' ? d.accountId : null, note: d.note || '' };
    s.docs.push(doc);
    if (d.payType !== 'credit') s.txns.push({ id: uid(), ref: id, ts: d.ts, accountId: d.accountId, amount: -total });
    else s.pent.push({ id: uid(), ref: id, ts: d.ts, partyId: d.partyId, delta: -total });
    if (c.freight > 0 && !c.freightInv) s.txns.push({ id: uid(), ref: id, ts: d.ts, accountId: d.freightAcct, amount: -c.freight });
    return doc;
  });
}

function positive(a) { if (!(+a > 0)) throw new Error('مبلغ باید بیشتر از صفر باشد.'); return R(+a); }
function addCashDoc(S, type, d) { // receipt | payment (با طرف‌حساب)
  return tx(S, s => {
    const amount = positive(d.amount); needAccount(s, d);
    if (!s.parties.find(p => p.id === d.partyId)) throw new Error('طرف‌حساب را انتخاب کنید.');
    const id = uid(), seq = nextSeq(s), sign = type === 'receipt' ? 1 : -1;
    s.docs.push({ id, seq, type, ts: d.ts, ledgerId: d.ledgerId, partyId: d.partyId, total: amount, accountId: d.accountId, note: d.note || '' });
    s.txns.push({ id: uid(), ref: id, ts: d.ts, accountId: d.accountId, amount: sign * amount });
    s.pent.push({ id: uid(), ref: id, ts: d.ts, partyId: d.partyId, delta: -sign * amount });
    return id;
  });
}
function addMoney(S, d) { // income | expense
  return tx(S, s => {
    const amount = positive(d.amount); needAccount(s, d);
    const cat = s.cats.find(c => c.id === d.catId); if (!cat) throw new Error('دسته‌بندی را انتخاب کنید.');
    const id = uid(), seq = nextSeq(s), sign = d.kind === 'income' ? 1 : -1;
    s.docs.push({ id, seq, type: d.kind, ts: d.ts, ledgerId: d.ledgerId, catId: d.catId, total: amount, accountId: d.accountId, note: d.note || '' });
    s.txns.push({ id: uid(), ref: id, ts: d.ts, accountId: d.accountId, amount: sign * amount });
    return id;
  });
}
function addPartnerPay(S, d) {
  return tx(S, s => {
    const amount = positive(d.amount); needAccount(s, d);
    const id = uid(), seq = nextSeq(s);
    s.docs.push({ id, seq, type: 'ppay', ts: d.ts, ledgerId: d.ledgerId, partnerId: d.partnerId, total: amount, accountId: d.accountId, note: d.note || '' });
    s.txns.push({ id: uid(), ref: id, ts: d.ts, accountId: d.accountId, amount: -amount });
    s.partE.push({ id: uid(), ref: id, ts: d.ts, partnerId: d.partnerId, amount: -amount, kind: 'payment' });
    return id;
  });
}
function addVisitorPay(S, d) {
  return tx(S, s => {
    const amount = positive(d.amount); needAccount(s, d);
    const id = uid(), seq = nextSeq(s);
    s.docs.push({ id, seq, type: 'vpay', ts: d.ts, ledgerId: d.ledgerId, visitorId: d.visitorId, total: amount, accountId: d.accountId, note: d.note || '' });
    s.txns.push({ id: uid(), ref: id, ts: d.ts, accountId: d.accountId, amount: -amount });
    s.visE.push({ id: uid(), ref: id, ts: d.ts, visitorId: d.visitorId, amount: -amount, kind: 'payment' });
    return id;
  });
}
function addVisitorSalary(S, d) {
  return tx(S, s => {
    const amount = positive(d.amount);
    const id = uid(), seq = nextSeq(s);
    s.docs.push({ id, seq, type: 'vsal', ts: d.ts, ledgerId: d.ledgerId, visitorId: d.visitorId, total: amount, note: d.note || '' });
    s.visE.push({ id: uid(), ref: id, ts: d.ts, visitorId: d.visitorId, amount, kind: 'salary' });
    return id;

/* ---------- مانده‌ها ---------- */
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
function partyBal(S, id, range) { return sum(S.pent.filter(e => e.partyId === id && inR(e.ts, range)), e => e.delta); } // مثبت: او به ما بدهکار است
function accountBal(S, id) { const a = S.accounts.find(x => x.id === id); return (a ? a.opening : 0) + sum(S.txns.filter(t => t.accountId === id), t => t.amount); }
function partnerBal(S, id) { return sum(S.partE.filter(e => e.partnerId === id), e => e.amount); } // مثبت: ما به او بدهکاریم
function visitorBal(S, id) { return sum(S.visE.filter(e => e.visitorId === id), e => e.amount); }
function inR(ts, r) { return !r || ((r.from == null || ts >= r.from) && (r.to == null || ts <= r.to)); }

/* ---------- گزارش ---------- */
function summary(S, r) {
  const docs = S.docs.filter(d => inR(d.ts, r) && (!r || !r.ledgerId || d.ledgerId === r.ledgerId));
  const sales = docs.filter(d => d.type === 'sale');
  const rev = sum(sales, d => d.sub), profit = sum(sales, d => d.profit);
  const cost = rev - profit;
  const comm = sum(sales, d => d.visitorComm), owner = sum(sales, d => d.ownerShare);
  const partners = S.partners.map(p => ({ id: p.id, name: p.name, amount: sum(sales, d => sum(d.shares.filter(x => x.partnerId === p.id), x => x.amount)) })).filter(p => p.amount !== 0);
  const salary = sum(docs.filter(d => d.type === 'vsal'), d => d.total);
  const exp = sum(docs.filter(d => d.type === 'expense'), d => d.total);
  const inc = sum(docs.filter(d => d.type === 'income'), d => d.total);
  const byProduct = {};
  for (const d of sales) for (const i of d.items) { const b = byProduct[i.pid] || (byProduct[i.pid] = { pid: i.pid, qty: 0, rev: 0, profit: 0 }); b.qty += i.qty; b.rev += i.total; b.profit += i.profit; }
  return { count: sales.length, rev, cost, profit, comm, owner, partners, salary, exp, inc, net: owner - salary + inc - exp, byProduct: Object.values(byProduct) };
}

/* ---------- آمار و تحلیل فروش ---------- */
function analytics(S, r) {
  r = r || {};
  const sales = S.docs.filter(d => d.type === 'sale' && inR(d.ts, r) && (!r.ledgerId || d.ledgerId === r.ledgerId)).sort((a, b) => a.ts - b.ts);
  const rev = sum(sales, d => d.sub), profit = sum(sales, d => d.profit);
  const parties = {}, prods = {}, wd = Array.from({ length: 7 }, () => ({ rev: 0, profit: 0, count: 0 })), pay = {};
  for (const d of sales) {

    out.push(['بیشترین حاشیه سود «' + nm(hi.pid) + '» (' + pct(hi.margin) + '٪) و کمترین «' + nm(lo.pid) + '» (' + pct(lo.margin) + '٪) است.' + (lo.margin < a.margin * 0.6 ? ' حاشیه‌ی «' + nm(lo.pid) + '» از میانگین کل (' + pct(a.margin) + '٪) خیلی پایین‌تره؛ قیمت فروش یا قیمت خرید رو بازبینی کن.' : '')]);
  }
  const wd = a.byWeekday, tw = wd.reduce((s, x) => s + x.rev, 0), bi = wd.reduce((b, x, i) => x.rev > wd[b].rev ? i : b, 0);
  if (tw > 0 && a.count >= 3) out.push(['بیشترین فروش در روز ' + WK[bi] + ' بوده (' + pct(wd[bi].rev / tw * 100) + '٪ از کل فروش).']);
  const cr = a.byPay.find(x => x.payType === 'credit'), tot = a.byPay.reduce((s, x) => s + x.rev, 0);
  if (cr && tot > 0) { const sh = cr.rev / tot * 100; out.push([pct(sh) + '٪ از فروش نسیه بوده.' + (sh > 40 ? ' سهم نسیه بالاست؛ مطالبات رو پیگیری کن.' : ''), sh > 40]); }
  const tc = a.byParty.slice().sort((x, y) => y.rev - x.rev)[0];
  if (tc && a.byParty.length > 1) { const sh = tc.rev / a.rev * 100; out.push(['بزرگ‌ترین مشتری «' + esc((party(tc.partyId) || {}).name) + '» ' + pct(sh) + '٪ از فروش را دارد.' + (sh > 40 ? ' وابستگی به یک مشتری زیاده.' : ''), sh > 40]); }
  if (a.customers) out.push([fa(a.repeat) + ' از ' + fa(a.customers) + ' مشتری بیش از یک بار خرید کرده‌اند.']);
  const sr = a.series.filter(b => b.kind), h = Math.floor(sr.length / 2);
  if (sr.length >= 4) {
    const p1 = sr.slice(0, h).reduce((s, b) => s + b.rev, 0), p2 = sr.slice(h).reduce((s, b) => s + b.rev, 0);
    if (p1 > 0) { const g = (p2 - p1) / p1 * 100; out.push(['نیمه‌ی دوم بازه نسبت به نیمه‌ی اول ' + pct(Math.abs(g)) + '٪ ' + (g >= 0 ? 'رشد' : 'کاهش') + ' فروش داشته.', g < -15]); }

}

  const pays = order.map(k => a.byPay.find(x => x.payType === k)).filter(Boolean);
